name: Terraform plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write       # OIDC token for AWS
  contents: read
  pull-requests: write  # post the plan as a PR comment

env:
  TF_VERSION: 1.14.5
  AWS_REGION: us-east-2

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check formatting (whole repo, including modules)
        run: terraform fmt -check -recursive

  detect:
    # Fork PRs never get AWS credentials (and plan-status fails them below).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.changed.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed stacks
        id: changed
        run: |
          stacks=$(.github/scripts/changed-stacks.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed stacks: $stacks"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one broken stack shouldn't hide the others' plans
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.stacks) }}
    concurrency:
      group: tf-plan-${{ matrix.dir }}
      cancel-in-progress: true   # a newer push to the PR supersedes the old plan
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        env:
          DIR: ${{ matrix.dir }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.DIR;
            const file = `${dir}/plan.txt`;
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No plan output: init or validate failed, see the job logs.';
            const max = 60000; // GitHub comments are capped at 65,536 chars
            if (plan.length > max) plan = '... (truncated, showing the end; full plan in the job logs)\n' + plan.slice(-max);

            const ok = process.env.OUTCOME === 'success';
            const marker = `<!-- tf-plan:${dir} -->`;
            const body = [
              marker,
              `### ${ok ? '✅' : '❌'} Terraform plan: \`${dir}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · run ${context.runId}_`,
            ].join('\n');

            // Update this stack's existing comment instead of adding a new one on every push.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # Single, stable check name for branch protection. Matrix job names change
  # with every PR, so they can't be marked "required" directly.
  plan-status:
    if: always()
    needs: [fmt, detect, plan]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "fmt=${{ needs.fmt.result }} detect=${{ needs.detect.result }} plan=${{ needs.plan.result }}"
          if [[ "${{ needs.detect.result }}" == "skipped" ]]; then
            echo "::error::PRs from forks are not planned. A maintainer must push the branch to this repo."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi